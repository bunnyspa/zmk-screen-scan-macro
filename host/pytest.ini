[pytest]
pythonpath = .
testpaths = tests

# If a test suite ever constructs real PyQt5 objects (RunController/
# PickController's QObjects are fine as long as no real QWidget gets
# instantiated - see test_run_controller.py/test_pick_controller.py's own
# docstrings) and starts segfaulting/hanging at session end: this is a
# known, root-caused upstream pytest issue, not this codebase's fault.
# pytest's own `unraisableexception` plugin forces gc.collect() at
# teardown (_pytest/unraisableexception.py's gc_collect_harder), which can
# walk a SIP-wrapped Qt object whose underlying C++ object is already
# destroyed - a Windows access violation. See pytest#7634, pytest#14500,
# pytest#13333. Fix: uncomment the addopts line below.
# addopts = -p no:unraisableexception
